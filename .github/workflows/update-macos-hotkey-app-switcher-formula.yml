name: Update macos-hotkey-app-switcher formula

on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [macos-hotkey-app-switcher-release]

permissions:
  contents: write

concurrency:
  group: update-macos-hotkey-app-switcher-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the updater
        run: python3 -m unittest tests/test_update_macos_hotkey_app_switcher_formula.py

      - name: Update formula from release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_macos_hotkey_app_switcher_formula.py

      - name: Validate formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap basnijholt/tap
          brew trust --formula basnijholt/tap/macos-hotkey-app-switcher
          tap_dir="$(brew --repo basnijholt/tap)"
          mkdir -p "$tap_dir/Formula"
          cp Formula/macos-hotkey-app-switcher.rb "$tap_dir/Formula/macos-hotkey-app-switcher.rb"
          brew style --formula basnijholt/tap/macos-hotkey-app-switcher
          brew audit --formula --online basnijholt/tap/macos-hotkey-app-switcher
          brew install --formula basnijholt/tap/macos-hotkey-app-switcher
          brew test basnijholt/tap/macos-hotkey-app-switcher

      - name: Commit and push update
        run: |
          if git diff --quiet -- Formula/macos-hotkey-app-switcher.rb; then
            echo "No formula update needed."
            exit 0
          fi

          version="$(ruby -ne 'puts $1 if %r{/releases/download/v([^/]+)/} =~ $_' Formula/macos-hotkey-app-switcher.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/macos-hotkey-app-switcher.rb
          git commit -m "Update macos-hotkey-app-switcher formula to v${version}"
          git push
