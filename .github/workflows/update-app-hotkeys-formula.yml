name: Update app-hotkeys formula

on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [app-hotkeys-release]

permissions:
  contents: write

concurrency:
  group: update-app-hotkeys-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the updater
        run: python3 -m unittest tests/test_update_app_hotkeys_formula.py

      - name: Update formula from release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_app_hotkeys_formula.py

      - name: Validate formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap basnijholt/tap
          brew trust --formula basnijholt/tap/app-hotkeys
          tap_dir="$(brew --repo basnijholt/tap)"
          mkdir -p "$tap_dir/Formula"
          cp Formula/app-hotkeys.rb "$tap_dir/Formula/app-hotkeys.rb"
          brew style --formula basnijholt/tap/app-hotkeys
          brew audit --formula --online basnijholt/tap/app-hotkeys
          brew install --formula basnijholt/tap/app-hotkeys
          brew test basnijholt/tap/app-hotkeys

      - name: Commit and push update
        run: |
          if git diff --quiet -- Formula/app-hotkeys.rb; then
            echo "No formula update needed."
            exit 0
          fi

          version="$(ruby -ne 'puts $1 if %r{/releases/download/v([^/]+)/} =~ $_' Formula/app-hotkeys.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/app-hotkeys.rb
          git commit -m "Update app-hotkeys formula to v${version}"
          git push
